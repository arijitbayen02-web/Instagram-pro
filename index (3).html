html.large-text{font-size:19px}

button{cursor:pointer;background:none;border:0;color:inherit;font:inherit;padding:0}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
img{-webkit-user-drag:none}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:inline-block}
.ic.fill{fill:currentColor}
.wordmark{font-family:"Grand Hotel","Segoe Script","Brush Script MT",cursive;font-weight:400;letter-spacing:.2px}
.badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:rgb(var(--like));color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid rgb(var(--bg));line-height:1}
.badge.hidden{display:none}

.nav-b.on{opacity:1}.nav-b.on .ic{stroke-width:2.7}.nav-b[data-nv=home].on .ic{fill:currentColor}

.side-b{opacity:.85}.side-b.on{font-weight:700;opacity:1}.side-b.on .ic{stroke-width:2.6}.side-b[data-sn=home].on .ic{fill:currentColor}
.act-b{display:grid;place-items:center;width:42px;height:42px;border-radius:999px}
.act-b:active{opacity:.6}
.story-ring.ring-none{background:transparent}
.story-ring.ring-grad{background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.story-ring.ring-seen{background:rgb(var(--s3))}
.story-ring.ring-cf{background:linear-gradient(135deg,#1ad76a,#0aa84f)}

.bigheart.pop{animation:bh .85s ease}

.pop-like{animation:pl .35s ease}@keyframes pl{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

html[data-theme=light] .spinner{border-color:rgba(0,0,0,.15);border-top-color:#000}
@keyframes sp{to{transform:rotate(360deg)}}
.eqb{display:inline-flex;gap:2px;align-items:flex-end;height:12px;flex-shrink:0}
.eqb i{width:2.5px;background:currentColor;border-radius:1px;height:4px}
.trk-chip.on .eqb i,.trk-chip[data-playing] .eqb i{animation:eq .8s ease-in-out infinite}
.eqb i:nth-child(2){animation-delay:.2s!important}.eqb i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

.fade-in{animation:fi .18s ease}@keyframes fi{from{opacity:0}}
.sheet-in{animation:si .22s cubic-bezier(.2,.8,.2,1)}@keyframes si{from{transform:translateY(40px);opacity:.4}}
.slide-in{animation:sli .22s cubic-bezier(.2,.8,.2,1)}@keyframes sli{from{transform:translateX(30px);opacity:.3}}
.no-sb{scrollbar-width:none}.no-sb::-webkit-scrollbar{display:none}
.vid-pending{background:#000}

.dp-viewer img,.dp-box img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none}

    if (tab === 'reports') h = D.reports.map(r => `<div class="border-b border-line px-4 py-3 text-sm"><div><b>${esc(r.type)}</b> · ${esc(r.reason)}</div><div class="text-xs text-mute">by @${esc(U(r.reporter).handle)} · ${ago(ms(r.ts))}${r.targetUid ? ' · target @' + esc(U(r.targetUid).handle) : ''}</div><div class="mt-2 flex flex-wrap gap-2">${r.type === 'post' ? `<button data-ad="rp-view" data-id="${r.targetId}" class="rounded-lg bg-s2 px-3 py-1.5 text-xs font-bold">View</button><button data-ad="rp-del" data-rid="${r.id}" data-id="${r.targetId}" class="rounded-lg bg-like/15 px-3 py-1.5 text-xs font-bold text-like">Delete post</button>` : ''}${r.type === 'story' ? `<button data-ad="rp-story" data-rid="${r.id}" data-id="${r.targetId}" class="rounded-lg bg-like/15 px-3 py-1.5 text-xs font-bold text-like">Delete story</button>` : ''}${r.type === 'comment' ? `<button data-ad="rp-comment" data-rid="${r.id}" data-id="${r.targetId}" class="rounded-lg bg-like/15 px-3 py-1.5 text-xs font-bold text-like">Delete comment</button>` : ''}${r.targetUid ? `<button data-ad="rp-ban" data-rid="${r.id}" data-uid="${r.targetUid}" class="rounded-lg bg-like/15 px-3 py-1.5 text-xs font-bold text-like">Suspend user</button>` : ''}<button data-ad="rp-dismiss" data-rid="${r.id}" class="rounded-lg bg-s2 px-3 py-1.5 text-xs font-bold">Dismiss</button></div></div>`).join('') || '<div class="py-16 text-center text-sm text-mute">No open reports 🎉</div>';
    if (tab === 'verify') h = D.vreq.map(r => `<div class="border-b border-line px-4 py-3 text-sm"><div class="font-semibold">@${esc(r.handle)} <span class="font-normal text-mute">${esc(r.name || '')}</span></div><div class="text-xs text-mute">${esc(r.reason || '')}</div><div class="mt-2 flex gap-2"><button data-ad="v-yes" data-id="${r.id}" class="rounded-lg bg-blue px-3 py-1.5 text-xs font-bold text-white">Approve</button><button data-ad="v-no" data-id="${r.id}" class="rounded-lg bg-s2 px-3 py-1.5 text-xs font-bold">Deny</button></div></div>`).join('') || '<div class="py-16 text-center text-sm text-mute">No pending requests.</div>';
    if (tab === 'app') h = `<div class="space-y-4 p-4"><div><label class="text-xs text-mute">Announcement banner (shown to everyone)</label><textarea data-an maxlength="200" rows="2" class="mt-1 w-full rounded-lg bg-s2 p-2.5 text-sm outline-none">${esc(S.app.announcement || '')}</textarea><button data-ad="an-save" class="mt-2 rounded-lg bg-blue px-4 py-2 text-xs font-bold text-white">Save announcement</button></div>
      ${[['maintenance', 'Maintenance mode', 'Blocks everyone except admin.'], ['registrations', 'Allow new sign-ups', 'Turn off to close registrations.']].map(([k, l, d]) => `<button data-ad="app-toggle" data-k="${k}" class="flex w-full items-center gap-3 rounded-xl bg-s2 px-4 py-3 text-left"><span class="flex-1"><span class="block text-[15px]">${l}</span><span class="text-xs text-mute">${d}</span></span><span class="relative h-[26px] w-[44px] rounded-full ${S.app[k] ? 'bg-blue' : 'bg-s3'}"><span class="absolute top-[3px] h-5 w-5 rounded-full bg-white shadow ${S.app[k] ? 'left-[21px]' : 'left-[3px]'}"></span></span></button>`).join('')}</div>`;
    body().innerHTML = `<div class="no-sb sticky top-0 z-10 flex gap-1 overflow-x-auto border-b border-line bg-bg px-2">${TABS.map(([k, l]) => `<button data-tab="${k}" class="shrink-0 border-b-2 px-3 py-3 text-sm font-semibold ${tab === k ? 'border-fg' : 'border-transparent text-mute'}">${l}</button>`).join('')}</div><div class="mx-auto max-w-[720px]">${h}</div>`;
    const uq = $('[data-uq]', o.el); if (uq) uq.oninput = () => { $('[data-ul]', o.el).innerHTML = userRows(D.users, uq.value.toLowerCase()); };
  }
  function userRows(list, q) { return list.filter(u => !q || (u.handle + ' ' + (u.name || '') + ' ' + (u.email || '')).toLowerCase().includes(q)).map(u => `<div class="flex items-center gap-3 border-b border-line px-4 py-2.5"><img src="${esc(avatarSrc(u))}" class="h-11 w-11 rounded-full object-cover" alt=""><div class="min-w-0 flex-1"><div class="flex items-center gap-1 truncate text-sm font-semibold">${esc(u.handle)}${u.verified ? verified(12) : ''}${u.banned ? '<span class="ml-1 rounded bg-like/20 px-1.5 text-[10px] text-like">SUSPENDED</span>' : ''}</div><div class="truncate text-xs text-mute">${esc(u.name || '')}${u.isPrivate ? ' · private' : ''}</div></div><button data-ad="uv" data-uid="${u.uid}" class="rounded-lg bg-s2 px-2.5 py-1.5 text-xs font-bold">${u.verified ? 'Unverify' : 'Verify'}</button><button data-ad="ub" data-uid="${u.uid}" class="rounded-lg ${u.banned ? 'bg-s2' : 'bg-like/15 text-like'} px-2.5 py-1.5 text-xs font-bold">${u.banned ? 'Restore' : 'Suspend'}</button></div>`).join('') || '<div class="py-16 text-center text-sm text-mute">No users.</div>'; }
  const resolve = async rid => { try { await FS.updateDoc(ref('reports', rid), { status: 'resolved' }); } catch (e) { } };
  o.el.addEventListener('click', async e => {
    const t1 = e.target.closest('[data-tab]'); if (t1) { tab = t1.dataset.tab; draw(); return; }
    const b = e.target.closest('[data-ad]'); if (!b) return; const a = b.dataset.ad, id = b.dataset.id, uid = b.dataset.uid;
    try {
      if (a === 'delpost') { const p = D.posts.find(x => x.id === id); if (await confirmDlg('Delete this post for everyone?', 'Delete', { danger: true, title: 'Moderation' })) { await deletePost(p, { keep: true }); D.posts = D.posts.filter(x => x.id !== id); draw(); } }
      else if (a === 'uv') { const u = U(uid), v = !u.verified; await FS.updateDoc(ref('users', uid), { verified: v }); cacheUser(uid, { verified: v }); const x = D.users.find(y => y.uid === uid); if (x) x.verified = v; draw(); }
      else if (a === 'ub') { const u = U(uid), v = !u.banned; if (uid === S.me.uid) { toast('You can’t suspend yourself'); return; } await FS.updateDoc(ref('users', uid), { banned: v }); cacheUser(uid, { banned: v }); const x = D.users.find(y => y.uid === uid); if (x) x.banned = v; toast(v ? 'User suspended' : 'User restored'); draw(); }
      else if (a === 'rp-view') openPostPage(id);
      else if (a === 'rp-del') { const p = findPost(id) || dd(await FS.getDoc(ref('posts', id))); await deletePost(p, { keep: true }); await resolve(b.dataset.rid); draw(); }
      else if (a === 'rp-story') { await FS.deleteDoc(ref('stories', id)); await resolve(b.dataset.rid); toast('Story removed'); draw(); }
      else if (a === 'rp-comment') { const [pid, cid] = id.split('/'); await FS.deleteDoc(ref('posts', pid, 'comments', cid)); try { await FS.updateDoc(ref('posts', pid), { commentsCount: FS.increment(-1) }); } catch (x) { } await resolve(b.dataset.rid); toast('Comment removed'); draw(); }
      else if (a === 'rp-ban') { await FS.updateDoc(ref('users', uid), { banned: true }); cacheUser(uid, { banned: true }); await resolve(b.dataset.rid); toast('User suspended'); draw(); }
      else if (a === 'rp-dismiss') { await resolve(b.dataset.rid); draw(); }
      else if (a === 'v-yes') { const r = D.vreq.find(x => x.id === id); await FS.updateDoc(ref('users', r.uid || id), { verified: true }); await FS.updateDoc(ref('verifyRequests', id), { status: 'approved' }); notify(r.uid || id, 'accepted'); toast('Approved'); draw(); }
      else if (a === 'v-no') { await FS.updateDoc(ref('verifyRequests', id), { status: 'denied' }); draw(); }
      else if (a === 'an-save') { await FS.setDoc(ref('app', 'settings'), { announcement: $('[data-an]', o.el).value.trim() }, { merge: true }); toast('Saved'); }
      else if (a === 'app-toggle') { const k = b.dataset.k; await FS.setDoc(ref('app', 'settings'), { [k]: !S.app[k] }, { merge: true }); S.app[k] = !S.app[k]; draw(); }
    } catch (x) { toast(errMsg(x)); }
  });
  draw();
}

/* =====================================================================
   ROUTER · BOOT
   ===================================================================== */
function navigate(path) {
  const h = '#/' + path;
  if (location.hash === h) route(); else location.hash = h;
}
function route() {
  if (!S.me) return;
  const parts = (location.hash.replace(/^#\/?/, '') || 'home').split('/').filter(Boolean), r = parts[0] || 'home', arg = decodeURIComponent(parts.slice(1).join('/'));
  if (S.view === 'chat' && r !== 'chat') leaveChat();
  closeAllOv(); Music.stop(); window.scrollTo(0, 0);
  const v = $('#view'); if (!v) return; v.innerHTML = '';
  if (r === 'home' || r === 'p') { S.view = 'home'; renderChrome(); renderHome(); if (r === 'p' && arg) openPostPage(arg); }
  else if (r === 'search') { S.view = 'search'; renderChrome(); renderSearch(); }
  else if (r === 'reels') { S.view = 'reels'; renderChrome(); renderReels(); }
  else if (r === 'dm') { S.view = 'dm'; renderChrome(); renderDM(); }
  else if (r === 'chat' && arg) { renderChat(arg); }
  else if (r === 'me') { renderProfile(S.me.handle); }
  else if (r === 'u' && arg) { renderProfile(arg); }
  else { S.view = 'home'; renderChrome(); renderHome(); }
  const nv = $('#nav'); if (nv) nv.classList.toggle('hidden', S.view === 'chat');
}
window.addEventListener('hashchange', () => { if (S.me) route(); });
window.addEventListener('error', e => console.warn('app error', e.message));
window.addEventListener('unhandledrejection', e => console.warn('promise', e.reason));
window.addEventListener('online', () => toast('Back online'));
window.addEventListener('offline', () => toast('You’re offline — changes will sync later', 4000));

async function boot() {
  try { const th = store.get('theme_cache', 'dark'); document.documentElement.dataset.theme = th === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : th; } catch (e) { }
  document.body.insertAdjacentHTML('afterbegin', spriteHTML());
  authScreen('loading');
  try { await initFirebase(); } catch (e) { console.error(e); authScreen('offline', 'Couldn’t load Firebase (' + (e.message || e) + '). Check your connection and reload.'); return; }
  AU.onAuthStateChanged(auth, u => { if (u) startSession(u); else { if (S.me || $('#app').innerHTML) endSession(); else { authScreen('form'); } } }, e => authScreen('offline', errMsg(e)));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__ev = c => eval(c); // dev/test hook (localhost only)

</script>
</body>
